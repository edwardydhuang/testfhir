<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FHIR 生理量測與病史上傳暨查詢系統</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #f4f7f6; margin: 0; padding: 20px; color: #333; }
        .container { max-width: 800px; margin: 0 auto; background: #fff; padding: 30px; border-radius: 8px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
        h1 { text-align: center; color: #2c3e50; }
        h2 { color: #34495e; font-size: 1.2rem; border-bottom: 2px solid #ecf0f1; padding-bottom: 5px; }
        .form-group { margin-bottom: 15px; }
        label { display: block; font-weight: bold; margin-bottom: 5px; }
        input[type="number"], select { width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 4px; box-sizing: border-box; }
        .radio-group { display: flex; gap: 15px; }
        .radio-group label { font-weight: normal; display: inline-flex; align-items: center; }
        .radio-group input { margin-right: 5px; }
        .row { display: flex; gap: 15px; flex-wrap: wrap; }
        .col { flex: 1; min-width: 200px; }
        
        button { width: 100%; padding: 12px; font-size: 16px; cursor: pointer; border: none; border-radius: 4px; transition: background 0.3s; margin-bottom: 10px; color: white; font-weight: bold; }
        .btn-primary { background-color: #3498db; }
        .btn-primary:hover { background-color: #2980b9; }
        .btn-secondary { background-color: #9b59b6; }
        .btn-secondary:hover { background-color: #8e44ad; }
        button:disabled { background-color: #bdc3c7; cursor: not-allowed; }
        
        .status { margin-top: 10px; font-weight: bold; text-align: center; }
        .success { color: #27ae60; }
        .error { color: #c0392b; }
        
        /* 查詢結果區塊樣式 */
        .query-options { background: #fdfefe; padding: 15px; border: 1px solid #d0d3d4; border-radius: 4px; margin-bottom: 15px; }
        .query-area { margin-top: 20px; display: none; background: #e8f4f8; border: 1px solid #bce8f1; padding: 20px; border-radius: 4px; }
        .query-area h3 { margin-top: 0; color: #31708f; border-bottom: 1px solid #bce8f1; padding-bottom: 10px; }
        
        .patient-group { background: #fff; margin-bottom: 20px; border-radius: 6px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); overflow: hidden; }
        .patient-header { background: #2c3e50; color: white; padding: 10px 15px; font-size: 1.1em; display: flex; justify-content: space-between; }
        
        .record-card { margin: 10px 15px; padding: 10px 15px; border-radius: 4px; border-left: 5px solid #ccc; background-color: #f9f9f9; }
        .record-card h4 { margin-top: 0; margin-bottom: 8px; font-size: 0.95em; }
        .record-content { margin: 0; padding-left: 20px; font-size: 0.9em; }
        .record-content li { margin-bottom: 4px; }
        
        /* 顏色區分 */
        .color-patient { border-left-color: #2c3e50; background-color: #f4f6f6; }
        .color-cond { border-left-color: #e74c3c; background-color: #fdedec; }
        .color-med { border-left-color: #f39c12; background-color: #fef5e7; }
        .color-obs { border-left-color: #3498db; background-color: #ebf5fb; }
    </style>
</head>
<body>

<div class="container">
    <h1>FHIR 醫療數據管理面板</h1>
    
    <!-- 區塊一：上傳資料 -->
    <h2>新增病患與量測紀錄</h2>
    <form id="fhirForm">
        <div class="row">
            <div class="col form-group">
                <label for="age">年齡 (Age)</label>
                <input type="number" id="age" required min="1" max="120" placeholder="例如: 45">
            </div>
            <div class="col form-group">
                <label for="gender">性別 (Gender)</label>
                <select id="gender" required>
                    <option value="male">男性 (Male)</option>
                    <option value="female">女性 (Female)</option>
                    <option value="other">其他 (Other)</option>
                    <option value="unknown">未知 (Unknown)</option>
                </select>
            </div>
        </div>

        <div class="row">
            <div class="col form-group">
                <label for="height">身高 (cm)</label>
                <input type="number" id="height" required min="50" max="250" step="0.1" placeholder="例如: 170.5">
            </div>
            <div class="col form-group">
                <label for="weight">體重 (kg)</label>
                <input type="number" id="weight" required min="2" max="300" step="0.1" placeholder="例如: 65.2">
            </div>
        </div>

        <div class="row">
            <div class="col form-group">
                <label for="systolic">收縮壓 (Systolic BP, mmHg)</label>
                <input type="number" id="systolic" required min="50" max="250" placeholder="例如: 120">
            </div>
            <div class="col form-group">
                <label for="diastolic">舒張壓 (Diastolic BP, mmHg)</label>
                <input type="number" id="diastolic" required min="30" max="150" placeholder="例如: 80">
            </div>
        </div>

        <div class="row">
            <div class="col form-group">
                <label>是否有高血壓病史？</label>
                <div class="radio-group">
                    <label><input type="radio" name="hypertension" value="yes" required> 是 (Yes)</label>
                    <label><input type="radio" name="hypertension" value="no" checked> 否 (No)</label>
                </div>
            </div>
            <div class="col form-group">
                <label>目前是否有服用降血壓藥物？</label>
                <div class="radio-group">
                    <label><input type="radio" name="medication" value="yes" required> 是 (Yes)</label>
                    <label><input type="radio" name="medication" value="no" checked> 否 (No)</label>
                </div>
            </div>
        </div>

        <button type="submit" id="submitBtn" class="btn-primary">打包、上傳並查詢本筆資料</button>
    </form>

    <div id="statusMsg" class="status"></div>

    <hr style="border: 0; border-top: 1px solid #ecf0f1; margin: 30px 0;">

    <!-- 區塊二：批次查詢 -->
    <h2>歷史查詢 (最近 30 分鐘)</h2>
    
    <div class="query-options">
        <label for="queryScope">查詢範圍：</label>
        <select id="queryScope">
            <option value="my_system">僅限本系統上傳的資料</option>
            <option value="world">全世界資料 (為避免超載，僅顯示最新 20 筆紀錄之關聯資料)</option>
        </select>
    </div>

    <button type="button" id="queryRecentBtn" class="btn-secondary">執行批次查詢</button>
    
    <!-- 查詢結果顯示區 -->
    <div class="query-area" id="queryArea">
        <h3 id="queryTitle">查詢結果</h3>
        <div id="queryData"></div>
    </div>

</div>

<script>
    const FHIR_BASE_URL = 'https://hapi.fhir.org/baseR4';
    const SYSTEM_TAG = { system: "http://my-system.org", code: "fhir-demo-app" }; 
    const genderMap = { 'male': '男', 'female': '女', 'other': '其他', 'unknown': '未知' };

    function generateUUID() {
        return 'xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx'.replace(/[xy]/g, function(c) {
            var r = Math.random() * 16 | 0, v = c == 'x' ? r : (r & 0x3 | 0x8);
            return v.toString(16);
        });
    }

    function calculateAge(birthDateString) {
        if (!birthDateString) return "未知";
        const today = new Date();
        const birthDate = new Date(birthDateString);
        let age = today.getFullYear() - birthDate.getFullYear();
        const m = today.getMonth() - birthDate.getMonth();
        if (m < 0 || (m === 0 && today.getDate() < birthDate.getDate())) { age--; }
        return age;
    }

    // --- 將不同資源渲染成統一的 HTML 卡片 ---
    function renderPatientGroup(patientId, groupedData) {
        const { patient, obs, cond, med } = groupedData;
        
        let html = `<div class="patient-group">`;
        html += `<div class="patient-header">
                    <span>病患歸屬：Patient/${patientId}</span>
                 </div>`;
        
        // 1. 渲染 Patient 基本資料
        if (patient) {
            const genderStr = genderMap[patient.gender] || patient.gender || '未知';
            const ageStr = calculateAge(patient.birthDate);
            html += `<div class="record-card color-patient">
                        <h4>基本資料</h4>
                        <ul class="record-content">
                            <li><strong>性別:</strong> ${genderStr}</li>
                            <li><strong>出生日期:</strong> ${patient.birthDate || '未提供'} (約 ${ageStr} 歲)</li>
                        </ul>
                     </div>`;
        } else {
            html += `<div class="record-card color-patient"><p style="margin:0;">找不到此病患的基本資料</p></div>`;
        }

        // 2. 渲染 Condition 病史
        if (cond.length > 0) {
            html += `<div class="record-card color-cond"><h4 style="color: #c0392b;">診斷病史</h4><ul class="record-content">`;
            cond.forEach(c => { html += `<li>${c.resource.code?.coding?.[0]?.display || '未知疾病'}</li>`; });
            html += `</ul></div>`;
        }

        // 3. 渲染 Medication 用藥
        if (med.length > 0) {
            html += `<div class="record-card color-med"><h4 style="color: #d35400;">用藥紀錄</h4><ul class="record-content">`;
            med.forEach(m => { html += `<li>${m.resource.medicationCodeableConcept?.text || '未知藥物'}</li>`; });
            html += `</ul></div>`;
        }

        // 4. 渲染 Observation 數值
        if (obs.length > 0) {
            html += `<div class="record-card color-obs"><h4 style="color: #2980b9;">最新生理數值</h4><ul class="record-content">`;
            obs.forEach(o => {
                const res = o.resource;
                const title = res.code?.coding?.[0]?.display || '未知項目';
                const timeStr = res.effectiveDateTime ? new Date(res.effectiveDateTime).toLocaleTimeString('zh-TW') : '';
                const timePrefix = timeStr ? `[${timeStr}] ` : '';
                
                if (res.valueQuantity) {
                    html += `<li>${timePrefix}<strong>${title}:</strong> ${res.valueQuantity.value} ${res.valueQuantity.unit}</li>`;
                } else if (res.component) {
                    html += `<li>${timePrefix}<strong>${title}:</strong><ul>`;
                    res.component.forEach(comp => {
                        html += `<li>${comp.code?.coding?.[0]?.display}: ${comp.valueQuantity?.value} ${comp.valueQuantity?.unit}</li>`;
                    });
                    html += `</ul></li>`;
                }
            });
            html += `</ul></div>`;
        }
        
        html += `</div>`;
        return html;
    }

    // --- 功能一：單筆查詢 (沿用，但改呼叫統一渲染) ---
    async function fetchAndDisplayVitals(patientId) {
        const queryArea = document.getElementById('queryArea');
        const queryDataUI = document.getElementById('queryData');
        
        queryArea.style.display = 'block';
        document.getElementById('queryTitle').textContent = `✅ 單筆查詢成功`;
        queryDataUI.innerHTML = '正在拉取完整病歷資料...';

        try {
            const [resPatient, resObs, resCond, resMed] = await Promise.all([
                fetch(`${FHIR_BASE_URL}/Patient/${patientId}`),
                fetch(`${FHIR_BASE_URL}/Observation?patient=${patientId}&_sort=-date`),
                fetch(`${FHIR_BASE_URL}/Condition?patient=${patientId}`),
                fetch(`${FHIR_BASE_URL}/MedicationStatement?patient=${patientId}`)
            ]);

            const groupedData = {
                patient: resPatient.ok ? await resPatient.json() : null,
                obs: resObs.ok ? (await resObs.json()).entry || [] : [],
                cond: resCond.ok ? (await resCond.json()).entry || [] : [],
                med: resMed.ok ? (await resMed.json()).entry || [] : []
            };

            queryDataUI.innerHTML = renderPatientGroup(patientId, groupedData);

        } catch (error) {
            queryDataUI.innerHTML = `<span class="error">查詢失敗：${error.message}</span>`;
        }
    }

    // --- 功能二：關聯式批次查詢 (抓出 Observation 後，反查 Patient 等其他資料) ---
    document.getElementById('queryRecentBtn').addEventListener('click', async function() {
        const btn = this;
        const scope = document.getElementById('queryScope').value;
        const queryArea = document.getElementById('queryArea');
        const queryDataUI = document.getElementById('queryData');
        
        btn.disabled = true;
        btn.textContent = '檢索中...';
        queryArea.style.display = 'block';
        document.getElementById('queryTitle').textContent = `🕒 最近 30 分鐘關聯紀錄 (${scope === 'my_system' ? '本系統' : '全世界'})`;
        queryDataUI.innerHTML = '1/2: 正在向伺服器檢索最新測量紀錄...';

        try {
            const thirtyMinsAgo = new Date(Date.now() - 30 * 60 * 1000).toISOString();
            // 限定 _count=30 避免拉取全世界資料時 API 超載或網址過長
            let targetUrl = `${FHIR_BASE_URL}/Observation?_lastUpdated=ge${thirtyMinsAgo}&_sort=-_lastUpdated&_count=30`;
            if (scope === 'my_system') targetUrl += `&_tag=${SYSTEM_TAG.code}`;
            
            const resObs = await fetch(targetUrl);
            if (!resObs.ok) throw new Error(`HTTP ${resObs.status}`);
            const obsData = await resObs.json();
            
            if (!obsData.entry || obsData.entry.length === 0) {
                queryDataUI.innerHTML = '<div class="record-card">查無任何生理數據紀錄。</div>';
                return;
            }

            // 萃取出所有出現過的 Patient ID
            const patientRefs = [...new Set(obsData.entry.map(e => e.resource.subject?.reference).filter(Boolean))];
            const patientIds = patientRefs.map(ref => ref.split('/')[1]).join(','); // 組合為 "ID1,ID2,ID3..."

            queryDataUI.innerHTML = `2/2: 找到 ${patientRefs.length} 位關聯病患，正在拉取病史與基本資料...`;

            // 同時發送請求，把這些 Patient ID 的 年齡、病史、用藥 一次查回來
            const [resPat, resCond, resMed] = await Promise.all([
                fetch(`${FHIR_BASE_URL}/Patient?_id=${patientIds}`),
                fetch(`${FHIR_BASE_URL}/Condition?patient=${patientIds}`),
                fetch(`${FHIR_BASE_URL}/MedicationStatement?patient=${patientIds}`)
            ]);

            const patBundle = resPat.ok ? await resPat.json() : { entry: [] };
            const condBundle = resCond.ok ? await resCond.json() : { entry: [] };
            const medBundle = resMed.ok ? await resMed.json() : { entry: [] };

            // 將所有資料進行分組整合
            const groups = {};
            patientRefs.forEach(ref => {
                const pid = ref.split('/')[1];
                groups[pid] = { patient: null, obs: [], cond: [], med: [] };
            });

            // 塞入 Patient 資料
            if (patBundle.entry) {
                patBundle.entry.forEach(e => { if (groups[e.resource.id]) groups[e.resource.id].patient = e.resource; });
            }
            // 塞入 Observation 資料
            obsData.entry.forEach(e => {
                const pid = e.resource.subject?.reference?.split('/')[1];
                if (groups[pid]) groups[pid].obs.push(e);
            });
            // 塞入 Condition 資料
            if (condBundle.entry) {
                condBundle.entry.forEach(e => {
                    const pid = e.resource.subject?.reference?.split('/')[1];
                    if (groups[pid]) groups[pid].cond.push(e);
                });
            }
            // 塞入 Medication 資料
            if (medBundle.entry) {
                medBundle.entry.forEach(e => {
                    const pid = e.resource.subject?.reference?.split('/')[1];
                    if (groups[pid]) groups[pid].med.push(e);
                });
            }

            // 渲染畫面
            let html = '';
            Object.keys(groups).forEach(pid => {
                html += renderPatientGroup(pid, groups[pid]);
            });
            queryDataUI.innerHTML = html;

        } catch (error) {
            queryDataUI.innerHTML = `<span class="error">查詢失敗：${error.message}</span>`;
        } finally {
            btn.disabled = false;
            btn.textContent = '執行批次查詢';
        }
    });

    // --- 表單提交 (上傳邏輯 - 與上個版本完全相同) ---
    document.getElementById('fhirForm').addEventListener('submit', async function(e) {
        e.preventDefault();
        
        const btn = document.getElementById('submitBtn');
        const statusMsg = document.getElementById('statusMsg');
        const queryArea = document.getElementById('queryArea');
        
        btn.disabled = true;
        btn.textContent = '資料上傳中...';
        statusMsg.textContent = '';
        statusMsg.className = 'status';
        queryArea.style.display = 'none';

        const age = parseInt(document.getElementById('age').value);
        const gender = document.getElementById('gender').value;
        const height = parseFloat(document.getElementById('height').value);
        const weight = parseFloat(document.getElementById('weight').value);
        const systolic = parseFloat(document.getElementById('systolic').value);
        const diastolic = parseFloat(document.getElementById('diastolic').value);
        const hasHypertension = document.querySelector('input[name="hypertension"]:checked').value === 'yes';
        const takingMedication = document.querySelector('input[name="medication"]:checked').value === 'yes';

        const patientUUID = "urn:uuid:" + generateUUID();
        const currentYear = new Date().getFullYear();
        const birthYear = currentYear - age;
        const currentTime = new Date().toISOString();
        const commonMeta = { meta: { tag: [SYSTEM_TAG] } };
        const entries = [];

        entries.push({
            fullUrl: patientUUID,
            request: { method: "POST", url: "Patient" },
            resource: { resourceType: "Patient", ...commonMeta, gender: gender, birthDate: `${birthYear}-01-01` }
        });

        const baseObservation = {
            resourceType: "Observation", ...commonMeta, status: "final",
            subject: { reference: patientUUID }, effectiveDateTime: currentTime
        };

        entries.push({
            fullUrl: "urn:uuid:" + generateUUID(), request: { method: "POST", url: "Observation" },
            resource: { ...baseObservation,
                category: [{ coding: [{ system: "http://terminology.hl7.org/CodeSystem/observation-category", code: "vital-signs" }] }],
                code: { coding: [{ system: "http://loinc.org", code: "8302-2", display: "Body height" }] },
                valueQuantity: { value: height, unit: "cm", system: "http://unitsofmeasure.org", code: "cm" }
            }
        });

        entries.push({
            fullUrl: "urn:uuid:" + generateUUID(), request: { method: "POST", url: "Observation" },
            resource: { ...baseObservation,
                category: [{ coding: [{ system: "http://terminology.hl7.org/CodeSystem/observation-category", code: "vital-signs" }] }],
                code: { coding: [{ system: "http://loinc.org", code: "29463-7", display: "Body weight" }] },
                valueQuantity: { value: weight, unit: "kg", system: "http://unitsofmeasure.org", code: "kg" }
            }
        });

        entries.push({
            fullUrl: "urn:uuid:" + generateUUID(), request: { method: "POST", url: "Observation" },
            resource: { ...baseObservation,
                category: [{ coding: [{ system: "http://terminology.hl7.org/CodeSystem/observation-category", code: "vital-signs" }] }],
                code: { coding: [{ system: "http://loinc.org", code: "85354-9", display: "Blood pressure panel with all children optional" }] },
                component: [
                    { code: { coding: [{ system: "http://loinc.org", code: "8480-6", display: "Systolic blood pressure" }] }, valueQuantity: { value: systolic, unit: "mmHg", system: "http://unitsofmeasure.org", code: "mm[Hg]" } },
                    { code: { coding: [{ system: "http://loinc.org", code: "8462-4", display: "Diastolic blood pressure" }] }, valueQuantity: { value: diastolic, unit: "mmHg", system: "http://unitsofmeasure.org", code: "mm[Hg]" } }
                ]
            }
        });

        if (hasHypertension) {
            entries.push({
                fullUrl: "urn:uuid:" + generateUUID(), request: { method: "POST", url: "Condition" },
                resource: { resourceType: "Condition", ...commonMeta, clinicalStatus: { coding: [{ system: "http://terminology.hl7.org/CodeSystem/condition-clinical", code: "active" }] }, code: { coding: [{ system: "http://snomed.info/sct", code: "38341003", display: "Hypertension" }] }, subject: { reference: patientUUID } }
            });
        }

        if (takingMedication) {
            entries.push({
                fullUrl: "urn:uuid:" + generateUUID(), request: { method: "POST", url: "MedicationStatement" },
                resource: { resourceType: "MedicationStatement", ...commonMeta, status: "active", medicationCodeableConcept: { text: "降血壓藥物 (Antihypertensive medication)" }, subject: { reference: patientUUID } }
            });
        }

        try {
            const response = await fetch(FHIR_BASE_URL, {
                method: 'POST', headers: { 'Content-Type': 'application/fhir+json' },
                body: JSON.stringify({ resourceType: "Bundle", type: "transaction", entry: entries })
            });

            if (response.ok) {
                const result = await response.json();
                statusMsg.textContent = '資料寫入完成！'; statusMsg.className = 'status success';
                const patientLocation = result.entry[0].response.location; 
                await fetchAndDisplayVitals(patientLocation.split('/')[1]);
            } else {
                const errorResult = await response.json();
                let errorText = `未知錯誤`;
                if (errorResult.resourceType === 'OperationOutcome' && errorResult.issue) {
                    errorText = errorResult.issue.map(i => i.diagnostics || i.code).join(' ; ');
                }
                statusMsg.textContent = `上傳失敗 (${response.status})：${errorText}`; statusMsg.className = 'status error';
            }
        } catch (error) {
            statusMsg.textContent = `錯誤：${error.message}`; statusMsg.className = 'status error';
        } finally {
            btn.disabled = false; btn.textContent = '打包、上傳並查詢本筆資料';
        }
    });
</script>

</body>
</html>

<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FHIR 生理量測與病史上傳暨查詢系統</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #f4f7f6; margin: 0; padding: 20px; color: #333; }
        .container { max-width: 800px; margin: 0 auto; background: #fff; padding: 30px; border-radius: 8px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
        h1 { text-align: center; color: #2c3e50; }
        .form-group { margin-bottom: 15px; }
        label { display: block; font-weight: bold; margin-bottom: 5px; }
        input[type="number"], select { width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 4px; box-sizing: border-box; }
        .radio-group { display: flex; gap: 15px; }
        .radio-group label { font-weight: normal; display: inline-flex; align-items: center; }
        .radio-group input { margin-right: 5px; }
        .row { display: flex; gap: 15px; }
        .col { flex: 1; }
        button { width: 100%; padding: 12px; background-color: #3498db; color: white; border: none; border-radius: 4px; font-size: 16px; cursor: pointer; margin-top: 20px; transition: background 0.3s; }
        button:hover { background-color: #2980b9; }
        button:disabled { background-color: #95a5a6; cursor: not-allowed; }
        .status { margin-top: 15px; font-weight: bold; text-align: center; }
        .success { color: #27ae60; }
        .error { color: #c0392b; }
        
        /* 查詢結果區塊樣式 */
        .query-area { margin-top: 30px; display: none; background: #e8f4f8; border: 1px solid #bce8f1; padding: 20px; border-radius: 4px; }
        .query-area h3 { margin-top: 0; color: #31708f; border-bottom: 1px solid #bce8f1; padding-bottom: 10px; }
        .query-data { margin-top: 15px; }
        .query-data ul { list-style-type: none; padding-left: 0; }
        .query-data li { margin-bottom: 8px; padding: 8px; background: #fff; border-radius: 4px; border-left: 4px solid #3498db; }
        .query-data li ul { margin-top: 8px; padding-left: 20px; }
        .query-data li li { border-left: none; background: transparent; padding: 4px; margin-bottom: 0; }
    </style>
</head>
<body>

<div class="container">
    <h1>FHIR 醫療數據上傳器</h1>
    <form id="fhirForm">
        <div class="row">
            <div class="col form-group">
                <label for="age">年齡 (Age)</label>
                <input type="number" id="age" required min="1" max="120" placeholder="例如: 45">
            </div>
            <div class="col form-group">
                <label for="gender">性別 (Gender)</label>
                <select id="gender" required>
                    <option value="male">男性 (Male)</option>
                    <option value="female">女性 (Female)</option>
                    <option value="other">其他 (Other)</option>
                    <option value="unknown">未知 (Unknown)</option>
                </select>
            </div>
        </div>

        <div class="row">
            <div class="col form-group">
                <label for="height">身高 (cm)</label>
                <input type="number" id="height" required min="50" max="250" step="0.1" placeholder="例如: 170.5">
            </div>
            <div class="col form-group">
                <label for="weight">體重 (kg)</label>
                <input type="number" id="weight" required min="2" max="300" step="0.1" placeholder="例如: 65.2">
            </div>
        </div>

        <div class="row">
            <div class="col form-group">
                <label for="systolic">收縮壓 (Systolic BP, mmHg)</label>
                <input type="number" id="systolic" required min="50" max="250" placeholder="例如: 120">
            </div>
            <div class="col form-group">
                <label for="diastolic">舒張壓 (Diastolic BP, mmHg)</label>
                <input type="number" id="diastolic" required min="30" max="150" placeholder="例如: 80">
            </div>
        </div>

        <div class="row">
            <div class="col form-group">
                <label>是否有高血壓病史？</label>
                <div class="radio-group">
                    <label><input type="radio" name="hypertension" value="yes" required> 是 (Yes)</label>
                    <label><input type="radio" name="hypertension" value="no"> 否 (No)</label>
                </div>
            </div>
            <div class="col form-group">
                <label>目前是否有服用降血壓藥物？</label>
                <div class="radio-group">
                    <label><input type="radio" name="medication" value="yes" required> 是 (Yes)</label>
                    <label><input type="radio" name="medication" value="no"> 否 (No)</label>
                </div>
            </div>
        </div>

        <button type="submit" id="submitBtn">打包、上傳並查詢資料</button>
    </form>

    <div id="statusMsg" class="status"></div>

    <!-- 查詢結果顯示區 -->
    <div class="query-area" id="queryArea">
        <h3>✅ 上傳成功！自 FHIR 伺服器讀取之最新紀錄：</h3>
        <div class="query-data" id="queryData">資料讀取中...</div>
    </div>

</div>

<script>
    const FHIR_BASE_URL = 'https://hapi.fhir.org/baseR4';

    function generateUUID() {
        return 'xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx'.replace(/[xy]/g, function(c) {
            var r = Math.random() * 16 | 0, v = c == 'x' ? r : (r & 0x3 | 0x8);
            return v.toString(16);
        });
    }

    // 負責發送 GET 請求去查詢資料的函數
    async function fetchAndDisplayVitals(patientId) {
        const queryDataUI = document.getElementById('queryData');
        queryDataUI.innerHTML = '正在向伺服器查詢 Observation 資料...';

        try {
            // 查詢該名 Patient 的所有 Observation
            const response = await fetch(`${FHIR_BASE_URL}/Observation?patient=${patientId}&_sort=-date`);
            if (!response.ok) throw new Error(`HTTP ${response.status}`);
            
            const data = await response.json();
            
            let html = `<div><strong>伺服器配發之 Patient ID:</strong> ${patientId}</div><ul>`;
            
            if (data.entry && data.entry.length > 0) {
                data.entry.forEach(entry => {
                    const res = entry.resource;
                    const title = res.code?.coding?.[0]?.display || '未知項目';
                    
                    if (res.valueQuantity) {
                        html += `<li><strong>${title}:</strong> ${res.valueQuantity.value} ${res.valueQuantity.unit}</li>`;
                    } else if (res.component) {
                        html += `<li><strong>${title}:</strong><ul>`;
                        res.component.forEach(comp => {
                            const compTitle = comp.code?.coding?.[0]?.display || '未知子項目';
                            const val = comp.valueQuantity?.value;
                            const unit = comp.valueQuantity?.unit;
                            html += `<li>${compTitle}: ${val} ${unit}</li>`;
                        });
                        html += `</ul></li>`;
                    }
                });
            } else {
                html += `<li>找不到該病患的生理數據。</li>`;
            }
            html += '</ul>';
            queryDataUI.innerHTML = html;

        } catch (error) {
            queryDataUI.innerHTML = `<span class="error">查詢失敗：${error.message}</span>`;
        }
    }

    document.getElementById('fhirForm').addEventListener('submit', async function(e) {
        e.preventDefault();
        
        const btn = document.getElementById('submitBtn');
        const statusMsg = document.getElementById('statusMsg');
        const queryArea = document.getElementById('queryArea');
        
        btn.disabled = true;
        btn.textContent = '處理中...';
        statusMsg.textContent = '';
        statusMsg.className = 'status';
        queryArea.style.display = 'none';

        const age = parseInt(document.getElementById('age').value);
        const gender = document.getElementById('gender').value;
        const height = parseFloat(document.getElementById('height').value);
        const weight = parseFloat(document.getElementById('weight').value);
        const systolic = parseFloat(document.getElementById('systolic').value);
        const diastolic = parseFloat(document.getElementById('diastolic').value);
        const hasHypertension = document.querySelector('input[name="hypertension"]:checked').value === 'yes';
        const takingMedication = document.querySelector('input[name="medication"]:checked').value === 'yes';

        const patientUUID = "urn:uuid:" + generateUUID();
        const currentYear = new Date().getFullYear();
        const birthYear = currentYear - age;

        const entries = [];

        entries.push({
            fullUrl: patientUUID,
            request: { method: "POST", url: "Patient" },
            resource: {
                resourceType: "Patient",
                gender: gender,
                birthDate: `${birthYear}-01-01`
            }
        });

        const baseObservation = {
            resourceType: "Observation",
            status: "final",
            subject: { reference: patientUUID },
            effectiveDateTime: new Date().toISOString()
        };

        entries.push({
            request: { method: "POST", url: "Observation" },
            resource: {
                ...baseObservation,
                category: [{ coding: [{ system: "http://terminology.hl7.org/CodeSystem/observation-category", code: "vital-signs" }] }],
                code: { coding: [{ system: "http://loinc.org", code: "8302-2", display: "Body height" }] },
                valueQuantity: { value: height, unit: "cm", system: "http://unitsofmeasure.org", code: "cm" }
            }
        });

        entries.push({
            request: { method: "POST", url: "Observation" },
            resource: {
                ...baseObservation,
                category: [{ coding: [{ system: "http://terminology.hl7.org/CodeSystem/observation-category", code: "vital-signs" }] }],
                code: { coding: [{ system: "http://loinc.org", code: "29463-7", display: "Body weight" }] },
                valueQuantity: { value: weight, unit: "kg", system: "http://unitsofmeasure.org", code: "kg" }
            }
        });

        entries.push({
            request: { method: "POST", url: "Observation" },
            resource: {
                ...baseObservation,
                category: [{ coding: [{ system: "http://terminology.hl7.org/CodeSystem/observation-category", code: "vital-signs" }] }],
                code: { coding: [{ system: "http://loinc.org", code: "85354-9", display: "Blood pressure panel with all children optional" }] },
                component: [
                    {
                        code: { coding: [{ system: "http://loinc.org", code: "8480-6", display: "Systolic blood pressure" }] },
                        valueQuantity: { value: systolic, unit: "mmHg", system: "http://unitsofmeasure.org", code: "mm[Hg]" }
                    },
                    {
                        code: { coding: [{ system: "http://loinc.org", code: "8462-4", display: "Diastolic blood pressure" }] },
                        valueQuantity: { value: diastolic, unit: "mmHg", system: "http://unitsofmeasure.org", code: "mm[Hg]" }
                    }
                ]
            }
        });

        if (hasHypertension) {
            entries.push({
                request: { method: "POST", url: "Condition" },
                resource: {
                    resourceType: "Condition",
                    clinicalStatus: { coding: [{ system: "http://terminology.hl7.org/CodeSystem/condition-clinical", code: "active" }] },
                    code: { coding: [{ system: "http://snomed.info/sct", code: "38341003", display: "Hypertension" }] },
                    subject: { reference: patientUUID }
                }
            });
        }

        if (takingMedication) {
            entries.push({
                request: { method: "POST", url: "MedicationStatement" },
                resource: {
                    resourceType: "MedicationStatement",
                    status: "active",
                    medicationCodeableConcept: { text: "降血壓藥物 (Antihypertensive medication)" },
                    subject: { reference: patientUUID }
                }
            });
        }

        const fhirBundle = {
            resourceType: "Bundle",
            type: "transaction",
            entry: entries
        };

        try {
            // 執行上傳
            const response = await fetch(FHIR_BASE_URL, {
                method: 'POST',
                headers: { 'Content-Type': 'application/fhir+json' },
                body: JSON.stringify(fhirBundle)
            });

            if (response.ok) {
                const result = await response.json();
                statusMsg.textContent = '資料寫入完成！正在讀取伺服器紀錄...';
                statusMsg.className = 'status success';
                
                // --- 解析伺服器配發的 Patient ID ---
                // Bundle Transaction 成功後，回傳的 result.entry 順序會與我們送出的順序一致
                // 第一筆 (entry[0]) 即為 Patient，它的 response.location 格式為 "Patient/[ID]/_history/[Version]"
                const patientLocation = result.entry[0].response.location; 
                const patientId = patientLocation.split('/')[1]; // 取出中間的 ID
                
                // 顯示查詢區塊並執行 GET 查詢
                queryArea.style.display = 'block';
                await fetchAndDisplayVitals(patientId);

            } else {
                statusMsg.textContent = `上傳失敗： HTTP 狀態碼 ${response.status}`;
                statusMsg.className = 'status error';
            }
        } catch (error) {
            statusMsg.textContent = `發生錯誤：${error.message}`;
            statusMsg.className = 'status error';
        } finally {
            btn.disabled = false;
            btn.textContent = '打包、上傳並查詢資料';
        }
    });
</script>

</body>
</html>
